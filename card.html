<body class="antialiased">
  <main class="mx-auto flex min-h-screen max-w-lg flex-col justify-center px-5 py-10 sm:px-6">

      <div class="px-6 pb-6 pt-7 sm:px-8 sm:pb-8">
        <p class="text-base font-bold text-[var(--brand)]">춘천 요양보호사 교육원</p>
        <h1 class="mt-2 text-3xl font-bold leading-snug">선한요양보호사교육원</h1>
        <p class="mt-3 text-lg leading-relaxed text-[var(--muted)]">높은 합격률! 자격증 취득부터 취업 연계까지 한번에</p>

        <dl class="mt-6 space-y-3 text-lg">

          </div>
          <div class="flex gap-3">
            <dt class="w-20 shrink-0 font-bold text-[var(--muted)]">상담실장</dt>
            <dd>이희권</dd>
          </div>
          <div class="flex gap-3">
            <dt class="w-20 shrink-0 font-bold text-[var(--muted)]">사무장</dt>
            <dd>박진권</dd>
          </div>
          <div class="flex gap-3">
            <dt class="w-20 shrink-0 font-bold text-[var(--muted)]">전화</dt>
            <dd><a class="font-bold text-[var(--brand)] underline-offset-4 hover:underline" href="tel:0332429908">033-242-9908</a></dd>
          </div>
          <div class="flex gap-3">
            <dt class="w-20 shrink-0 font-bold text-[var(--muted)]">주소</dt>
            <dd>강원특별자치도 춘천시 영서로 2261, 4층</dd>
          </div>
        </dl>

        <label class="mt-8 block text-base font-bold" for="card-phone">받는 번호</label>
        <input id="card-phone" class="mt-2 w-full rounded-2xl border-2 border-[var(--line)] px-4 py-3 text-lg" type="tel" inputmode="tel" autocomplete="tel" placeholder="010-0000-0000" />
        <button id="contact-share" class="mt-3 inline-flex min-h-12 w-full items-center justify-center rounded-full border-2 border-[var(--line)] bg-white px-4 text-base font-bold" type="button">연락처에서 선택</button>
        <p class="mt-2 text-base leading-relaxed text-[var(--muted)]">저장된 연락처를 고르거나, 없는 번호는 위에 적으면 됩니다. 받은 명함의 주소를 누르면 홈페이지로 이동합니다.</p>

        <div class="mt-5 grid gap-3">
          <button id="kakao-share" type="button" class="inline-flex min-h-14 items-center justify-center gap-2 rounded-full bg-[var(--kakao)] px-4 text-base font-bold text-[var(--kakao-ink)] hover:brightness-95">
            <svg class="h-6 w-6" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor" d="M12 4C7.03 4 3 7.13 3 11c0 2.45 1.58 4.6 4 5.86V20l3.16-1.74c.6.08 1.21.14 1.84.14 4.97 0 9-3.13 9-7s-4.03-7-9-7z" />

            카카오톡 공유

          <button id="sms-share" class="inline-flex min-h-14 items-center justify-center gap-2 rounded-full bg-[var(--brand)] px-4 text-base font-bold text-white hover:bg-[var(--brand-hover)]" type="button">문자 보내기</button>
          <a class="inline-flex min-h-14 items-center justify-center gap-2 rounded-full border-2 border-[var(--brand)] bg-white px-4 text-base font-bold text-[var(--brand)] hover:bg-[var(--brand-mist)]" href="tel:0332429908">
            <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.35 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.35 1.85.57 2.81.7A2 2 0 0 1 22 16.92z" />
            </svg>
            033-242-9908 전화하기
          </a>
          <a class="inline-flex min-h-14 items-center justify-center gap-2 rounded-full bg-[var(--brand)] px-4 text-base font-bold text-white" href="https://sunhancare.vercel.app/">홈페이지 바로가기</a>

    </article>

    <p class="mt-6 text-center text-base">
      <a class="font-bold text-[var(--brand)] underline-offset-4 hover:underline" href="https://sunhancare.vercel.app/">교육원 홈페이지 보기</a>
    </p>
  </main>

  <script>
    const shareUrl = 'https://sunhancare.vercel.app/';
    const kakaoJavaScriptKey = '880435f162b00880a80c025d267ab968';
    if (window.Kakao && !Kakao.isInitialized()) {
      Kakao.init(kakaoJavaScriptKey);
    }

    document.getElementById('kakao-share').setAttribute('aria-label', '카카오톡으로 명함 전달하기');
    document.getElementById('kakao-share').addEventListener('click', function () {
      if (!window.Kakao || !Kakao.isInitialized()) {
        window.alert('카카오톡 공유를 준비하지 못했습니다. 카카오 앱 키를 확인해 주세요.');
        return;
      }

      try {
        Kakao.Share.sendDefault({
          objectType: 'feed',
          content: {
            title: '선한요양보호사교육원 전자명함',
            description: '요양보호사 자격증 취득 및 교육 문의',
            imageUrl: 'https://sunhancare.vercel.app/image/1.png',
            link: {
              mobileWebUrl: shareUrl,
              webUrl: shareUrl
            }
          },
          buttons: [
            {
              title: '홈페이지 바로가기',
              link: { mobileWebUrl: shareUrl, webUrl: shareUrl }
            }
          ]
        });
      } catch (error) {
        window.alert('카카오톡 공유를 열지 못했습니다. 카카오 앱 키와 등록된 사이트 도메인을 확인해 주세요.');
      }
    });

    const cardPhone = document.getElementById('card-phone');
    const shareText = '선한요양보호사교육원 전자명함입니다.\n' + shareUrl;

    function phoneNumbers(value) {
      return String(value || '').split(/[,，\n]/).map(function (part) {
        return part.replace(/\D/g, '');
      }).filter(function (digits) {
        return digits.length >= 9;
      });
    }

    function openSms(numbers) {
      const body = encodeURIComponent(shareText);
      const list = numbers.join(',');
      const isiOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
      if (isiOS && numbers.length > 1) {
        window.location.href = 'sms:/open?addresses=' + list + '&body=' + body;
        return;
      }
      window.location.href = isiOS ? 'sms:' + list + '&body=' + body : 'sms:' + list + '?body=' + body;
    }

    function preferredTel(person) {
      const digits = (person.tel || []).map(function (tel) {
        return String(tel).replace(/\D/g, '');
      }).filter(function (item) {
        return item.length >= 9;
      });
      const mobile = digits.filter(function (item) {
        return item.indexOf('010') === 0 || item.indexOf('8210') === 0;
      });
      return mobile[0] || digits[0] || '';
    }

    document.getElementById('sms-share').addEventListener('click', function () {
      const numbers = phoneNumbers(cardPhone.value);
      if (!numbers.length) {
        cardPhone.setCustomValidity('받는 번호를 입력하거나 연락처에서 선택해 주세요.');
        cardPhone.reportValidity();
        return;
      }
      cardPhone.setCustomValidity('');
      openSms(numbers);
    });
    cardPhone.addEventListener('input', function () {
      cardPhone.setCustomValidity('');
    });

    document.getElementById('contact-share').addEventListener('click', function () {
      if (!navigator.contacts || !navigator.contacts.select) {
        window.alert('이 브라우저에서는 연락처 목록을 열 수 없습니다. 안드로이드 크롬에서는 저장된 연락처를 고를 수 있고, 그 외에는 번호를 직접 입력해 주세요.');
        return;
      }
      navigator.contacts.select(['name', 'tel'], { multiple: true }).then(function (contacts) {
        const numbers = (contacts || []).map(preferredTel).filter(Boolean);
        if (!numbers.length) {
          window.alert('선택한 연락처에 전화번호가 없습니다.');
          return;
        }
        cardPhone.value = numbers.join(', ');
        cardPhone.setCustomValidity('');
        openSms(numbers);
      }).catch(function (error) {
        if (error && error.name === 'AbortError') return;
        window.alert('연락처를 열지 못했습니다. 번호를 직접 입력해 주세요.');
      });
    });
  </script>
